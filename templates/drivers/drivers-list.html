{% extends 'base.html' %}

{% block content %}

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Drivers</h1>

        <div>
            <a href="{% url 'driver-standings' %}" class="btn btn-outline-dark">View Driver Standings</a>
            <a href="{% url 'driver-create' %}" class="btn btn-primary">Add Driver</a>
        </div>
    </div>
    
    <ul>
        {% for driver in drivers %}
            <li>
                <a href="{% url 'driver-details' driver.id %}">
                {{ driver.first_name }} {{ driver.last_name }}
                </a>
            </li>
        {% endfor %}
    </ul>

{% endblock %}
