{% extends 'base.html' %}

{% block content %}

    <h1>Edit {{ team.name }}</h1>

    <form method='POST'>
        {% csrf_token %}
        {{ form.as_p }}
        
        <button class="btn btn-success">Save Changes</button>
        
        <a href="{% url 'team-details' team.id %}" class="btn btn-secondary">Cancel</a>
    
    </form>

{% endblock %}
