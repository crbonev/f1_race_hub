{% extends 'base.html' %}

{% block content %}

    <h2>Delete {{ team.name }}</h2>

    <p>Are you sure you want to delete this team?</p>

    <form method="post">

        {% csrf_token %}

        <button class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'team-details' team.id %}" class="btn btn-secondary">Cancel</a>

    </form>

{% endblock %}
