{% extends 'base.html' %}

{% block content %}

<h2>Races</h2>

<ul>
    {% for race in races %}
        <li>
            <a href="{% url 'race-details' race.pk %}">
                {{ race.name }} - {{ race.location }}
            </a>
        </li>
    {% endfor %}
</ul>

<a href="{% url 'race-create' %}">Create Race</a>

{% endblock %}
